<style>
/* Layout: full-viewport vertical scroll-snap sections; fixed glyph rail for jumping between grahas.
   Single deliberately-dark cosmic theme (a projected teaching presentation). */
:root{
  --bg:#0a0e24; --bg2:#0d1230;
  --ink:#f2ecd8;            /* warm parchment */
  --soft:#b7bcdd;           /* muted lavender-grey body */
  --mute:#7e85ad;           /* captions */
  --gold:#e7c36a;           /* primary accent */
  --panel:rgba(255,255,255,0.045);
  --panel2:rgba(255,255,255,0.07);
  --stroke:rgba(255,255,255,0.12);
  --accent:#e7c36a;         /* per-section overridden */
  color-scheme:dark;
  --serif:'EB Garamond','Noto Serif Tamil','Noto Serif Devanagari',Georgia,serif;
  --display:'Cormorant Garamond','EB Garamond','Noto Serif Devanagari',Georgia,serif;
  --sans:'Mukta',system-ui,-apple-system,sans-serif;
  --glyphf:'Noto Sans Symbols','EB Garamond',serif;
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity; scroll-behavior:smooth; -webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:clamp(17px,1.15vw,21px); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.tamil{font-family:'Noto Serif Tamil','EB Garamond',serif}
.deva{font-family:'Noto Serif Devanagari','EB Garamond',serif}
.glyph{font-family:var(--glyphf); line-height:1}
.sans{font-family:var(--sans)}
em{color:var(--soft); font-style:italic}
b,strong{color:var(--ink); font-weight:500}

/* ---- section shell ---- */
section{
  position:relative; min-height:100svh; width:100%;
  scroll-snap-align:start;
  display:flex; flex-direction:column; justify-content:center;
  padding:clamp(40px,6vh,90px) clamp(20px,6vw,120px);
  padding-right:clamp(20px,6vw,120px);
  overflow:hidden;
}
@supports not (min-height:100svh){ section{min-height:100vh} }
.wrap{width:100%; max-width:1180px; margin:0 auto; position:relative; z-index:2}

/* giant faint glyph watermark behind a graha */
.watermark{
  position:absolute; right:clamp(-30px,-1vw,0px); top:50%; transform:translateY(-50%);
  font-family:var(--glyphf); font-size:min(78vh,760px); line-height:1;
  color:var(--accent); opacity:0.07; z-index:1; pointer-events:none; user-select:none;
}
.eyebrow{
  font-family:var(--sans); font-weight:600; font-size:clamp(13px,1vw,16px);
  letter-spacing:0.28em; text-transform:uppercase; color:var(--accent);
}

/* ---- hero ---- */
#hero{background:radial-gradient(ellipse at 50% 32%, #182250 0%, #0b1030 52%, #070a1e 100%); text-align:center}
#hero .wrap{max-width:1000px; display:flex; flex-direction:column; align-items:center; gap:clamp(22px,3.2vh,40px)}
.om{font-family:var(--deva,'Noto Serif Devanagari'); font-size:clamp(46px,7vw,86px); color:var(--gold)}
.sloka{
  font-family:'Noto Serif Devanagari',serif; font-size:clamp(23px,3vw,40px); line-height:1.75;
  color:var(--ink); font-weight:400;
}
.sloka-tr{font-family:var(--display); font-style:italic; font-size:clamp(17px,1.7vw,24px); color:var(--soft); line-height:1.7}
.sloka-en{font-family:var(--serif); font-size:clamp(15px,1.3vw,19px); color:var(--mute); max-width:62ch; line-height:1.6}
.hero-title{font-family:var(--display); font-weight:600; font-size:clamp(44px,8vw,104px); line-height:1.02; color:var(--ink); margin:0}
.hero-sub{font-family:var(--serif); font-size:clamp(17px,1.6vw,23px); color:var(--soft)}
.hero-names{font-family:var(--serif); font-size:clamp(16px,1.5vw,22px); color:var(--gold); letter-spacing:0.02em}
.scrollcue{font-family:var(--sans); font-size:13px; letter-spacing:0.22em; text-transform:uppercase; color:var(--mute); margin-top:6px}

/* ---- intro blocks ---- */
.lead{font-size:clamp(20px,1.7vw,27px); line-height:1.55; color:var(--ink); max-width:30ch}
h2.secttl{font-family:var(--display); font-weight:600; font-size:clamp(34px,5vw,64px); line-height:1.06; margin:0.2em 0 0.5em; text-wrap:balance; color:var(--ink)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,1.6vw,26px)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:clamp(16px,1.6vw,26px)}
.card{background:var(--panel); border:1px solid var(--stroke); border-radius:18px; padding:clamp(22px,2vw,32px); min-width:0}
.card h3{font-family:var(--sans); font-weight:700; font-size:clamp(15px,1.1vw,18px); letter-spacing:0.12em; text-transform:uppercase; margin:0 0 12px; color:var(--accent)}
.card p,.card li{color:var(--soft); font-size:clamp(16px,1.15vw,20px); line-height:1.5}
.card ul{margin:0; padding-left:1.1em}
.card li{margin:4px 0}

/* cabinet table */
.mini{width:100%; border-collapse:collapse; font-family:var(--serif)}
.mini td{padding:9px 8px; border-bottom:1px solid var(--stroke); color:var(--soft); font-size:clamp(15px,1.1vw,19px)}
.mini td:first-child{color:var(--ink); white-space:nowrap; padding-right:20px}

/* ---- graha section ---- */
.graha-head{display:flex; align-items:baseline; gap:24px; flex-wrap:wrap}
.g-glyph{font-family:var(--glyphf); font-size:clamp(64px,8vw,110px); color:var(--accent); line-height:0.9}
.g-ord{font-family:var(--sans); font-weight:700; font-size:clamp(14px,1vw,17px); letter-spacing:0.25em; color:var(--mute); text-transform:uppercase}
.g-name{font-family:var(--display); font-weight:600; font-size:clamp(46px,7.5vw,96px); line-height:1; color:var(--ink); margin:0}
.g-en{font-family:var(--serif); font-style:italic; font-size:clamp(20px,2vw,30px); color:var(--accent)}
.namerow{display:flex; gap:clamp(18px,3vw,54px); flex-wrap:wrap; margin-top:14px; font-size:clamp(16px,1.3vw,21px)}
.namerow .lbl{font-family:var(--sans); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:2px}
.namerow .val{color:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:9px; margin:20px 0}
.chip{font-family:var(--sans); font-size:clamp(13px,0.95vw,16px); font-weight:400; color:var(--ink);
  background:var(--panel2); border:1px solid var(--stroke); border-radius:100px; padding:6px 15px}
.chip b{color:var(--accent); font-weight:600}
.karaka{font-size:clamp(18px,1.45vw,25px); line-height:1.55; color:var(--soft); max-width:70ch; margin:18px 0 22px}
.karaka b{color:var(--ink)}
.props{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 36px; margin-top:6px}
.prop{display:flex; gap:14px; padding:7px 0; border-bottom:1px solid var(--stroke); font-size:clamp(14px,1.05vw,18px); min-width:0}
.prop .k{font-family:var(--sans); font-weight:600; font-size:clamp(11px,0.85vw,13px); letter-spacing:0.1em; text-transform:uppercase; color:var(--mute); width:118px; flex-shrink:0; padding-top:3px}
.prop .v{color:var(--ink); min-width:0}
.keynote{font-family:var(--display); font-style:italic; font-size:clamp(19px,1.9vw,30px); line-height:1.4;
  color:var(--accent); margin-top:24px; padding-left:20px; border-left:3px solid var(--accent); max-width:62ch}
.disputed{background:rgba(231,195,106,0.09); border:1px solid rgba(231,195,106,0.28); border-radius:14px;
  padding:14px 20px; margin-top:18px; font-size:clamp(14px,1.05vw,18px); color:var(--soft); max-width:78ch}
.disputed b{color:var(--gold)}

/* ---- comparison table ---- */
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--stroke); border-radius:16px}
table.cmp{border-collapse:collapse; width:100%; min-width:760px; font-size:clamp(13px,1vw,17px)}
table.cmp th,table.cmp td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--stroke); white-space:nowrap}
table.cmp thead th{position:sticky; top:0; background:#141a3e; color:var(--gold); font-family:var(--sans); font-weight:600; font-size:clamp(12px,0.9vw,15px); letter-spacing:0.04em}
table.cmp td:first-child{color:var(--ink)}
table.cmp td{color:var(--soft)}
table.cmp .gl{font-family:var(--glyphf); margin-right:7px}
.tnote{font-size:clamp(13px,1vw,16px); color:var(--mute); margin-top:14px; max-width:80ch}

/* ---- closing ---- */
#closing{background:radial-gradient(ellipse at 50% 60%, #15204c 0%, #0a0e26 60%, #070a1e 100%); text-align:center}

/* ---- fixed glyph nav rail ---- */
nav.rail{
  position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:50;
  display:flex; flex-direction:column; gap:5px; padding:10px 8px;
  background:rgba(10,14,36,0.55); backdrop-filter:blur(8px);
  border:1px solid var(--stroke); border-radius:100px;
}
nav.rail a{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  font-family:var(--glyphf); font-size:19px; color:var(--mute); text-decoration:none;
  border-radius:50%; transition:color .2s, background .2s; position:relative;
}
nav.rail a:hover{color:var(--ink); background:var(--panel2)}
nav.rail a[aria-current="true"]{color:var(--g, var(--gold)); background:var(--panel2)}
nav.rail a:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
nav.rail a .tip{
  position:absolute; right:46px; top:50%; transform:translateY(-50%);
  font-family:var(--sans); font-size:13px; white-space:nowrap; color:var(--ink);
  background:rgba(10,14,36,0.92); border:1px solid var(--stroke); border-radius:8px;
  padding:4px 10px; opacity:0; pointer-events:none; transition:opacity .15s;
}
nav.rail a:hover .tip{opacity:1}

/* back to lesson hub */
a.backhub{
  position:fixed; left:14px; top:calc(14px + env(safe-area-inset-top,0px)); z-index:50;
  font-family:var(--sans); font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--soft); text-decoration:none; padding:7px 14px;
  background:rgba(10,14,36,0.55); backdrop-filter:blur(8px);
  border:1px solid var(--stroke); border-radius:100px;
}
a.backhub:hover{color:var(--ink)}
a.backhub:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

@media (max-width:860px){
  nav.rail{ right:0; left:0; top:auto; bottom:0; transform:none; flex-direction:row;
    justify-content:flex-start; border-radius:0; gap:2px; overflow-x:auto; padding:7px 10px;
    padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
    border-left:none; border-right:none; border-bottom:none; }
  nav.rail a{width:36px; height:36px; flex:0 0 auto}
  nav.rail a .tip{display:none}
  section{padding-bottom:80px}
  .props{grid-template-columns:1fr; gap:4px 0}
  .grid3,.grid2{grid-template-columns:1fr}
  .graha-head{gap:14px}
}
</style>

/* ---------- render ---------- */

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* hero */
main.appendChild(el(`

/* grahas */
for(const g of G){
  if(!g.name) continue;
  const props = g.props.map(([k,v])=>`<div class="prop"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const chips = g.chips.map(c=>`<span class="chip">${c}</span>`).join("");
  const disputed = g.disputed ? `<div class="disputed">${g.disputed}</div>` : "";
  main.appendChild(el(`

  <div class="watermark glyph" aria-hidden="true">${g.glyph}</div>

    <div class="graha-head">
      <span class="g-glyph glyph">${g.glyph}</span>

      <div><span class="lbl sans">Also</span><span class="val" style="color:var(--soft)">${g.epi}</span></div>

    <div class="chips">${chips}</div>
    <p class="karaka">${g.karaka}</p>
    <div class="props">${props}</div>

}

    <p class="tnote" style="margin:30px auto 0; text-align:center; max-width:70ch">Classical Jyotiṣa, Lahiri / Chitrapakṣa framework. Properties follow Bṛhat Parāśara Horā Śāstra, Sārāvalī, Bṛhat Jātaka and Phaladīpikā. Gemstone, deity and grain associations follow common South-Indian usage and vary by lineage.</p>
  </div>
</section>`));

/* ---------- nav rail ---------- */
const navItems = G.filter(g=>g.glyph);
for(const g of navItems){
  const label = g.name || g.nav || "";
  const a = el(`<a href="#${g.id}" style="--g:${g.accent||'var(--gold)'}"><span class="glyph">${g.glyph}</span><span class="tip">${label}</span></a>`);
  rail.appendChild(a);
}

/* active state via IntersectionObserver */
const links = Array.from(rail.querySelectorAll("a"));
const byId = Object.fromEntries(links.map(a=>[a.getAttribute("href").slice(1), a]));
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      links.forEach(l=>l.removeAttribute("aria-current"));
      const a = byId[e.target.id];
      if(a) a.setAttribute("aria-current","true");
    }
  });
},{rootMargin:"-45% 0px -45% 0px", threshold:0});
document.querySelectorAll("section").forEach(s=>{ if(byId[s.id]) obs.observe(s); });
</script>
